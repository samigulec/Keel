name: Release

# Builds Keel for Apple silicon and Intel and publishes it as a GitHub
# release with a .dmg and a .zip. Run it from the Actions tab ("Run
# workflow") or by pushing a tag such as v0.2.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0"
        required: true
        default: "0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Apple silicon + Intel)
        run: |
          xcodebuild build \
            -project Keel.xcodeproj \
            -scheme Keel \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=""

      - name: Check the app
        run: |
          APP=build/Build/Products/Release/Keel.app
          lipo -info "$APP/Contents/MacOS/Keel"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist"

      - name: Package
        run: |
          mkdir -p dist dmg
          ditto build/Build/Products/Release/Keel.app dmg/Keel.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Keel $VERSION" -srcfolder dmg -ov -format UDZO "dist/Keel-$VERSION.dmg"
          ditto -c -k --keepParent build/Build/Products/Release/Keel.app "dist/Keel-$VERSION.zip"
          shasum -a 256 dist/* | tee dist/SHA256.txt

      - name: Publish
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Keel $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
